<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Страница не найдена — ArCode</title>
		<meta name="robots" content="noindex, follow" />
		<meta name="theme-color" content="#080808" />
		<meta http-equiv="refresh" content="5; url=/" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link
			rel="icon"
			href="/icons/favicon-32x32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 32px;
				font-family: Inter, Arial, sans-serif;
				background:
					radial-gradient(circle at 80% 15%, #5b1525 0, transparent 32%),
					#080808;
				color: #f5f5f0;
			}

			main {
				width: min(760px, 100%);
			}

			p {
				margin: 0 0 18px;
				color: #a6a6a0;
				font-size: clamp(16px, 2.2vw, 20px);
				line-height: 1.55;
			}

			.redirect-countdown {
				display: inline-block;
				min-width: 1ch;
				color: #f5f5f0;
				font-weight: 800;
				font-variant-numeric: tabular-nums;
				text-align: center;
			}

			strong {
				display: block;
				margin-bottom: 18px;
				color: #ff3b5f;
				font-size: 14px;
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0 0 24px;
				font-size: clamp(54px, 12vw, 128px);
				line-height: 0.9;
				letter-spacing: -0.07em;
			}

			a {
				display: inline-flex;
				align-items: center;
				min-height: 52px;
				margin-top: 18px;
				padding: 0 24px;
				border: 1px solid rgba(255, 255, 255, 0.18);
				border-radius: 999px;
				background: #f5f5f0;
				color: #080808;
				font-weight: 800;
				text-decoration: none;
				transition:
					transform 0.35s ease,
					box-shadow 0.35s ease,
					background 0.35s ease,
					border-color 0.35s ease,
					color 0.35s ease;
			}

			a:hover {
				transform: translateY(-2px);
				box-shadow: 0 14px 34px rgba(255, 59, 95, 0.14);
				background: #ecece6;
				border-color: rgba(255, 255, 255, 0.3);
				color: #ff3b5f;
			}

			a:focus-visible {
				outline: 2px solid rgba(255, 59, 95, 0.7);
				outline-offset: 3px;
			}

			@media (prefers-reduced-motion: reduce) {
				a {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<strong>Ошибка 404</strong>
			<h1>Такой страницы нет.</h1>
			<p>
				Возможно, адрес изменился или в ссылке опечатка. Автоматически верну
				тебя на главную через
				<span class="redirect-countdown" data-redirect-countdown>5</span> сек.
			</p>
			<a href="/">Вернуться на главную</a>
		</main>
		<script>
			(() => {
				const countdown = document.querySelector("[data-redirect-countdown]");

				if (!countdown) return;

				let secondsLeft = 5;
				const timer = window.setInterval(() => {
					secondsLeft -= 1;

					if (secondsLeft <= 0) {
						window.clearInterval(timer);
						window.location.replace("/");
						return;
					}

					countdown.textContent = String(secondsLeft);
				}, 1000);
			})();
		</script>
	</body>
</html>
