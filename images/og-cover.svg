<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
	<title id="title">ArCode — разработка сайтов для бизнеса под ключ</title>
	<desc id="description">Фирменная обложка ArCode для социальных сетей</desc>
	<defs>
		<radialGradient id="redGlow" cx="0" cy="0" r="1" gradientTransform="translate(1050 84) rotate(132) scale(430 430)" gradientUnits="userSpaceOnUse">
			<stop stop-color="#ff3b5f" stop-opacity="0.48" />
			<stop offset="1" stop-color="#ff3b5f" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientTransform="translate(70 620) rotate(-38) scale(430 330)" gradientUnits="userSpaceOnUse">
			<stop stop-color="#ff7a1a" stop-opacity="0.3" />
			<stop offset="1" stop-color="#ff7a1a" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="accent" x1="54" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
			<stop stop-color="#ff3b5f" />
			<stop offset="1" stop-color="#ff7a1a" />
		</linearGradient>
		<pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
			<path d="M 52 0 L 0 0 0 52" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
		</pattern>
	</defs>

	<rect width="1200" height="630" fill="#080808" />
	<rect width="1200" height="630" fill="url(#grid)" />
	<rect width="1200" height="630" fill="url(#redGlow)" />
	<rect width="1200" height="630" fill="url(#orangeGlow)" />
	<rect x="26" y="26" width="1148" height="578" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.1" />

	<g transform="translate(64 58)">
		<circle cx="35" cy="35" r="35" fill="#f5f5f0" />
		<text x="35" y="46" text-anchor="middle" fill="#080808" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-4">&lt;/&gt;</text>
		<text x="91" y="30" fill="#f5f5f0" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">ARCODE</text>
		<text x="92" y="56" fill="#8f8f89" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">WEB DEVELOPMENT</text>
	</g>

	<text x="64" y="255" fill="#f5f5f0" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">РАЗРАБОТКА САЙТОВ</text>
	<text x="64" y="352" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="98" font-weight="900" letter-spacing="-5">ПОД КЛЮЧ</text>
	<text x="68" y="414" fill="#b7b7b0" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Лендинги · WordPress · Tilda · Интернет-магазины</text>

	<line x1="64" y1="500" x2="1136" y2="500" stroke="#ffffff" stroke-opacity="0.13" />
	<text x="64" y="552" fill="#f5f5f0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">arcode-dev.ru</text>
	<text x="1136" y="552" text-anchor="end" fill="#8f8f89" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2">САЙТЫ ДЛЯ БИЗНЕСА</text>
</svg>
